function courseTopic(c){return c.name.includes('성인')?'패혈증':c.name.includes('아동')?'발달과 의사소통':c.name.includes('정신')?'치료적 의사소통':c.name.includes('관리')?'인수인계':c.name.includes('여성')||c.name.includes('모성')?'산후 관찰':c.name.includes('지역')?'예방':'투약안전'}
function renderLearn(){
 if(view.sub==='quiz')return renderQuiz();if(view.sub==='quiz-result')return renderQuizResult();if(view.sub==='course')return renderCourse();if(view.sub==='doc')return renderDoc();
 let html=`<div class="page-head"><div><div class="eyebrow">01 &nbsp; LEARN</div><h1>지식을 연결하는 학습</h1><p>내 수업에서 시작해, 판단이 필요한 순간까지.</p></div><span class="date-chip">2026 · 2학기</span></div>${tabs([['courses','내 수업'],['exam','국시 대비'],['ai','AI 학습']],view.learnTab,'learn-tab')}`;
 if(state.quiz&&!state.quiz.complete)html+=`<div class="session-resume"><div><b>풀던 문제가 있어요</b><p>${esc(state.quiz.title)} · ${state.quiz.index+1}/${state.quiz.ids.length}문제</p></div>${btn('이어서 풀기','resume-quiz','','secondary small')}</div>`;
 if(view.learnTab==='courses')return html+`${sectionHead('이번 학기 내 수업',`${state.courses.length}개 수업 · 교수님 클래스 없이도 시작할 수 있어요`,btn(icon('plus')+' 수업 등록','add-course','','secondary small'))}<div class="course-grid">${state.courses.map((c,i)=>`<button class="course-card" data-action="course" data-id="${esc(c.id)}"><div class="between"><span class="icon-tile ${i%3===1?'mint':i%3===2?'lavender':''}">${icon('book')}</span><span class="tag">${c.type==='official'?'클래스':'내 수업'}</span></div><h3>${esc(c.name)}</h3><p class="meta">${esc(c.professor||'교수명 미등록')} · ${esc(c.grade)} ${esc(c.section)}</p><div class="bottom"><span>학습자료 ${state.docs.filter(d=>d.courseId===c.id).length}개 · 추천 복습</span>${icon('arrow')}</div></button>`).join('')}</div>${!state.courses.length?`<div class="card empty">${icon('book')}<h3>나만의 수업부터 시작해요</h3><p>교수님 클래스가 없어도 PDF를 올리고 복습할 수 있어요.</p>${btn('첫 수업 등록','add-course')}</div>`:''}<div class="notice blue section row">${icon('spark')}<span>Goodnotes 등에서 필기한 PDF를 가져오세요. 기본 요약부터 실전 훈련 추천까지 이어집니다.</span></div>`;
 if(view.learnTab==='exam')return html+renderExam();
 return html+renderAI();
}
function renderCourse(){const c=state.courses.find(c=>c.id===view.courseId);if(!c){view.sub=null;return renderLearn()}const ds=state.docs.filter(d=>d.courseId===c.id),topic=courseTopic(c),r=diseaseRate(topic);return `<div class="breadcrumb"><button data-action="learn-tab" data-tab="courses">학습</button>${icon('chevron')}<span>내 수업</span></div><div class="page-head"><div><div class="eyebrow">MY COURSE</div><h1>${esc(c.name)}</h1><p>${esc(c.professor||'교수명 미등록')} · ${esc(c.grade)} ${esc(c.section)}</p></div><button class="icon-btn" data-action="delete-course" data-id="${esc(c.id)}" aria-label="수업 삭제">${icon('trash')}</button></div><div class="grid2"><div class="stack"><div class="card">${sectionHead('내 학습자료','필기한 자료가 나만의 복습 출발점이 됩니다.')}<p class="meta" style="margin-bottom:19px">Goodnotes 등에서 필기한 PDF를 저장한 뒤 가져오세요.</p>${btn(icon('upload')+' 필기한 PDF 업로드','upload-course',`data-id="${esc(c.id)}"`,'full')}${ds.map(docRow).join('')||'<p class="inline-empty">아직 자료가 없어요. 첫 PDF를 업로드해보세요.</p>'}</div></div><div class="stack"><div class="card soft"><div class="eyebrow">NEXT LEARNING</div><h2>${esc(topic)}${r!==null?` <small class="orange">${r}%</small>`:''}</h2><p class="meta" style="margin:12px 0 19px">개념을 확인하고, 상황에 적용하는 문제를 풀어요.</p>${tags([topic,'맞춤 복습','무료'])}<div style="margin-top:20px">${btn('추천 문제 풀기 '+icon('arrow'),'start-quiz',`data-topic="${esc(topic)}"`)}</div></div><div class="card"><h3>최근 학습</h3>${state.quizRuns.filter(r=>r.title.includes(topic)).slice(-3).reverse().map(r=>`<div class="activity-line"><div class="icon-tile">${icon('check')}</div><div><b>${esc(r.title)}</b><p>${r.day} · ${r.correct}/${r.total}문제 정답</p></div></div>`).join('')||`<p class="meta" style="margin-top:12px">이번 시연에서 완료한 학습이 여기에 쌓여요.</p>`}<div class="divider"></div><p class="tiny">취약한 문제 유형</p><h3 class="orange" style="margin-top:7px">${esc(weakType())} ${rate(metrics().types[weakType()])}%</h3></div></div></div>`}
function docRow(d){return `<button class="list-row" data-action="doc" data-id="${esc(d.id)}"><span class="icon-tile">${icon('pdf')}</span><div class="grow"><h3 style="overflow-wrap:anywhere">${esc(d.name)}</h3><p>${d.sample?'샘플 자료':'내가 선택한 자료'} · 분석 DEMO 완료</p></div><span class="tag ${d.reviewed?'green':'blue'}">${d.reviewed?'복습 완료':'복습하기'}</span></button>`}
function renderExam(){const s=view.subject;let list=QUESTIONS.filter(q=>q.subject===s&&!q.id.startsWith('sa'));const topics=[...new Set(list.map(q=>q.disease))];return `<div class="notice blue"><b>KNOWLEDGE TEST</b><br>시험에서 정답을 선택하는 연습입니다. 실전에서는 같은 지식을 상황 속 판단으로 이어가요.</div><div class="filter-pills">${SUBJECTS.map(x=>`<button class="${s===x?'on':''}" data-action="subject" data-subject="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="card">${sectionHead(s,'자체 제작 DEMO 문항 · 기본 문제풀이 무료',`<span class="tag blue">${list.length}문제</span>`)}${topics.map((t,i)=>`<div class="list-row"><span class="icon-tile ${i%2?'mint':''}">${icon(t==='투약안전'?'shield':'note')}</span><div class="grow"><h3>${esc(t)}</h3><p>${list.filter(q=>q.disease===t).length}문제 · ${list.filter(q=>q.disease===t).map(q=>q.type).slice(0,3).join(' / ')}</p></div>${btn('시작','start-quiz',`data-topic="${esc(t)}" data-mode="exam" data-subject="${esc(s)}"`,'secondary small')}</div>`).join('')}</div><div class="section">${btn('과목 전체 문제 풀기 '+icon('arrow'),'start-subject',`data-subject="${esc(s)}"`,'full')}</div><p class="mini-note">실제 국가시험 기출·출제 경향을 재현한 모의고사가 아닌 학습 흐름 검증용 예시입니다.</p>`}
function quizIds(topic,subject=null,custom=false){if(custom)return ['sa1','sa2','sa3'];let list=QUESTIONS.filter(q=>q.disease===topic&&!q.id.startsWith('sa')&&(!subject||q.subject===subject));if(!list.length)list=QUESTIONS.filter(q=>q.subject===subject&&!q.id.startsWith('sa'));return list.slice(0,3).map(x=>x.id)}
function createQuiz(topic,mode='major',subject=null,custom=false,all=false){const ids=all?QUESTIONS.filter(q=>q.subject===subject&&!q.id.startsWith('sa')).map(x=>x.id):quizIds(topic,subject,custom);if(!ids.length){toast('이 과목의 예시 문제를 준비 중이에요.');return}state.quiz={id:uid('quiz'),title:custom?'내 자료 기반 · 패혈증 복습':all?subject+' · Knowledge Test':(subject||QUESTION_MAP[ids[0]].subject)+' · '+topic,topic,mode,ids,index:0,answers:[],complete:false,xp:0,school:0,custom};view.page='learn';view.sub='quiz';render(true)}
function startQuizWithGuard(args){if(state.quiz&&!state.quiz.complete&&state.quiz.answers.length){showModal('학습을 전환할까요?',`<p class="muted">답한 문제와 획득 XP는 저장됩니다. 풀던 세트는 종료하고 새 학습을 시작해요.</p><div class="modal-actions">${btn('계속 풀기','resume-quiz','','light')}${btn('새 학습 시작','confirm-quiz')}</div>`);pendingQuiz=args;return}createQuiz(...args)}
let pendingQuiz=null;
function renderQuiz(){const r=state.quiz;if(!r){view.sub=null;return renderLearn()}if(r.complete)return renderQuizResult();const q=QUESTION_MAP[r.ids[r.index]],a=r.answers[r.index];return `<div class="narrow"><button class="back-link" data-action="pause-quiz">${icon('back')} 학습으로 · 진행 자동 저장</button><div class="page-head"><div><div class="eyebrow">${r.custom?'AI REVIEW · DEMO':r.mode==='exam'?'KNOWLEDGE TEST':'FOCUSED REVIEW'}</div><h1>${esc(q.subject)} · ${esc(q.disease)}</h1></div><span class="tag blue">${r.index+1} / ${r.ids.length}</span></div><div class="progress" aria-label="문제 진행률"><i style="width:${r.index/r.ids.length*100}%"></i></div><div class="card quiz-card" style="margin-top:20px"><div class="between wrap">${tags(q.tags)}<span class="tiny">난이도 ${q.difficulty}/5 <span class="difficulty" aria-hidden="true">${[1,2,3,4,5].map(x=>`<i class="${x<=q.difficulty?'on':''}"></i>`).join('')}</span></span></div><h2 class="quiz-title">${esc(q.stem)}</h2><div class="quiz-options">${q.options.map((text,i)=>`<button class="option ${a?i===q.answer?'correct':i===a.choice?'wrong':'':''}" data-action="answer" data-index="${i}" ${a?'disabled':''}><span class="letter">${i+1}</span><span>${esc(text)}</span>${a&&i===q.answer?icon('check'):''}</button>`).join('')}</div>${a?`<div class="feedback ${a.correct?'':'wrong'}" role="status"><h3>${a.correct?'잘 연결했어요. 정답입니다.':'이 판단을 함께 짚어볼까요?'} <span class="tiny">${a.xp?'+'+a.xp+' XP':a.correct?'오늘 이 문항의 보상은 이미 받았어요':''}</span></h3><p>${esc(q.explanation)}</p><div class="skill"><b>이 문제에서 연습한 역량</b><br>${esc(q.skill)}</div></div>`:''}<div class="quiz-actions"><span class="tiny">정답 +30 XP · 학교 +5점<br>같은 문항 보상은 하루 한 번</span><button class="btn" data-action="next-question" ${a?'':'disabled'}>${r.index===r.ids.length-1?'학습 결과 보기':'다음 문제'} ${icon('arrow')}</button></div></div><p class="blank-rule">문항은 학습용 예시입니다. 푼 결과는 질환·문제 유형별로 누적됩니다.</p>${SOURCES}</div>`}
function answer(index){const r=state.quiz;if(!r||r.complete||r.answers[r.index])return;const q=QUESTION_MAP[r.ids[r.index]];if(index<0||index>=q.options.length)return;const correct=index===q.answer;meaningfulDay();const gained=correct?award('question:'+q.id+':'+day(),30,5,'문제 정답'):0;const a={qid:q.id,choice:index,correct,day:day(),session:r.id,xp:gained};r.answers.push(a);state.answers.push(a);r.xp+=gained;r.school+=gained?5:0;render();setTimeout(()=>$('.feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}
function nextQuestion(){const r=state.quiz;if(!r||!r.answers[r.index])return;if(r.index<r.ids.length-1){r.index++;render(true)}else{if(!r.complete){r.complete=true;state.quizRuns.push({id:r.id,title:r.title,topic:r.topic,correct:r.answers.filter(x=>x.correct).length,total:r.ids.length,day:day()});addActivity(r.title,'문제 복습 완료','book');}view.sub='quiz-result';render(true)}}
function relatedCase(topic){return topic==='투약안전'?'medication':['호흡곤란','COPD','심부전'].includes(topic)?'dyspnea':'sepsis'}
function renderQuizResult(){const r=state.quiz;if(!r)return renderLearn();const correct=r.answers.filter(a=>a.correct).length,wrong=[...new Set(r.answers.filter(a=>!a.correct).map(a=>QUESTION_MAP[a.qid].type))],c=CASE_INFO[relatedCase(r.topic)],weak=weakType(),nonClinical=!['패혈증','심부전','호흡곤란','COPD','투약안전'].includes(r.topic);return `<div class="narrow"><div class="page-head"><div><div class="eyebrow">LEARN → PRACTICE</div><h1>아는 것에서, 해내는 것으로.</h1><p>${esc(r.title)} · 학습 완료</p></div><span class="icon-tile mint">${icon('check')}</span></div><div class="card"><div class="report-top"><div><h2>${r.ids.length}문제 중 ${correct}문제 정답</h2><p class="meta" style="margin-top:6px">이번 결과가 질환·문제 유형별 기록에 반영됐어요.</p></div><div class="report-score">${Math.round(correct/r.ids.length*100)}<small>%</small></div></div><div class="rewards"><span class="reward">${icon('bolt')} +${r.xp} XP</span><span class="reward">${icon('school')} 학교 +${r.school}점</span></div><div class="notice ${wrong.length?'orange':'green'}"><b>${wrong.length?'이번에 다시 볼 유형: '+wrong.join(' · '):'이번 세트는 모두 잘 풀었어요.'}</b><br>누적 기록에서는 ${esc(weak)}${weak==='우선순위'?' 판단':''}(${rate(metrics().types[weak])}%)이 가장 낮아요. 상황 속에서 적용해보면 도움이 됩니다.</div><div class="result-callout"><div class="eyebrow">RECOMMENDED CLINICAL</div><h3>${esc(c.name)}</h3><p>${nonClinical?'현재 제공되는 공통 환자안전 훈련을 추천해요. 이 과목 전용 시나리오는 확장 예정입니다.':'방금 복습한 개념으로, 변하는 환자 상황에 대응해보세요.'}<br>4단계 판단 · 약 2분 · 완료 +200 XP</p>${btn('추천 실전 훈련 시작 '+icon('arrow'),'start-case',`data-id="${relatedCase(r.topic)}"`)}</div><div class="between wrap" style="margin-top:18px"><button class="text-btn" data-action="nav" data-page="my">누적 취약점 확인 ${icon('arrow')}</button><button class="text-btn" data-action="learn-tab" data-tab="courses">학습으로 돌아가기</button></div></div></div>`}
function renderClinical(){if(view.sub==='case')return renderCase();if(view.sub==='clinical-result')return renderClinicalResult();let r=state.clinical;return `<div class="page-head clinical-head"><div><div class="eyebrow">02 &nbsp; PRACTICE</div><h1>Clinical Simulation</h1><p>상황을 읽고, 우선순위를 정하고, 다음 행동을 선택하세요.</p></div><span class="tag blue">임상 실전 훈련</span></div><div class="notice blue row" style="margin-bottom:24px">${icon('clinical')}<span><b>당신의 선택이 다음 상황을 바꿉니다.</b><br>실습생의 역할에서 사정·도움 요청·안전 확인·보고를 연습해요.</span></div>${r&&!r.complete?`<div class="session-resume"><div><b>진행 중인 훈련이 있어요</b><p>${esc(CASE_INFO[r.caseId].short)} · STEP ${r.step+1}/4</p></div>${btn('이어서 훈련','resume-case','','secondary small')}</div>`:''}${Object.entries(CASE_INFO).map(([id,c],i)=>`<article class="scenario-card"><div class="scenario-art ${c.color}">${icon(c.icon)}</div><div><div class="eyebrow">SCENARIO 0${i+1} ${state.clinicalRuns.some(r=>r.caseId===id)?'<span class="tag green">훈련 기록 있음</span>':''}</div><h3>${esc(c.short)}</h3><p class="description">${esc(c.desc)}</p>${tags(c.tags)}</div><div class="side">${btn('훈련 시작 '+icon('arrow'),'start-case',`data-id="${id}"`)}<p class="tiny">4단계 · 약 2분 · +200 XP</p></div></article>`).join('')}<p class="tiny">기본 시나리오 3개는 무료예요. 시나리오별 XP·학교 점수 보상은 하루 한 번 제공됩니다.</p>${state.clinicalRuns.length?`<div class="section card">${sectionHead('최근 Clinical Report','선택과 피드백을 다시 살펴보세요.')}${state.clinicalRuns.slice(-3).reverse().map(r=>`<button class="list-row" data-action="view-report" data-id="${r.id}"><span class="icon-tile mint">${icon('chart')}</span><div class="grow"><h3>${esc(CASE_INFO[r.caseId].short)}</h3><p>${r.day} · 평균 ${Math.round(r.scores.reduce((a,b)=>a+b,0)/4)}점</p></div>${icon('chevron')}</button>`).join('')}</div>`:''}<div class="future"><div class="row"><b>NEXT · 신규간호사 실전 과정</b><span class="tag">확장 예정</span></div><p>졸업 후에도 이어지는 Clinical Training.<br>병동별 상황훈련 · SBAR · 응급상황 · 투약안전 · 인수인계 · 우선순위 판단</p></div>${SOURCES}`}
function beginCase(id){if(!CASE_INFO[id])return;if(state.clinical&&!state.clinical.complete){if(state.clinical.caseId===id){view.page='clinical';view.sub='case';closeModal();render(true);return}showModal('진행 중인 훈련이 있어요',`<p class="muted">새 시나리오를 시작하면 아직 완료하지 않은 훈련을 처음부터 다시 시작해야 해요.</p><div class="modal-actions">${btn('이어서 훈련','resume-case','','light')}${btn('새 훈련 시작','confirm-case',`data-id="${id}"`)}</div>`);return}newCase(id)}
function newCase(id){const c=CASE_INFO[id];state.clinical={id:uid('clinical'),caseId:id,step:0,vitals:[...c.vitals],flags:{},risk:0,history:[],complete:false,selected:null};view.page='clinical';view.sub='case';closeModal();render(true)}
function monitor(c,r){const v=r.vitals;return `<div class="monitor"><div class="monitor-head"><span><i class="live-dot"></i>PATIENT MONITOR</span><span>DEMO</span></div><svg class="monitor-wave" viewBox="0 0 360 38" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22h38l5-4 5 4h21l7-12 8 23 8-31 9 29 7-9h54l4-4 5 4h23l7-12 8 23 8-31 9 29 7-9h66l4-4 5 4h27" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><div class="vitals"><div class="vital ${c.disease==='패혈증'?'alert':''}"><small>혈압 · BP</small><strong>${v[0]}</strong><span>mmHg</span></div><div class="vital"><small>맥박 · HR</small><strong>${v[1]}</strong><span>회/분</span></div><div class="vital"><small>호흡 · RR</small><strong>${v[2]}</strong><span>회/분</span></div><div class="vital ${Number(v[3])<94?'alert':''}"><small>SpO₂</small><strong>${v[3]}</strong><span>%</span></div><div class="vital"><small>체온 · BT</small><strong>${v[4]}<span>°C</span></strong><small style="margin-left:auto">교육용 예시 수치</small></div></div></div>`}
function renderCase(){const r=state.clinical;if(!r){view.sub=null;return renderClinical()}if(r.complete)return renderClinicalResult();const c=CASE_INFO[r.caseId],s=clinicalStep(r),selected=r.selected!==null,last=r.history[r.history.length-1];return `<div class="breadcrumb"><button data-action="pause-case">실전</button>${icon('chevron')}<span>${esc(c.short)}</span><span class="tag" style="margin-left:auto">자동 저장</span></div><div class="page-head clinical-head"><div><div class="eyebrow">CLINICAL SIMULATION</div><h1>${esc(c.short)}</h1></div><button class="icon-btn" data-action="pause-case" aria-label="훈련 저장 후 나가기">${icon('close')}</button></div><div class="clinical-layout"><aside class="card patient-panel"><div class="patient-id"><div class="patient-avatar">${icon('user')}</div><div><h3>${esc(c.patient)}</h3><p>${esc(c.ward)}</p></div></div>${tags(c.tags)}${monitor(c,r)}<p class="patient-detail"><strong>환자 배경</strong><br>${esc(c.history)}</p><div class="case-note">${esc(c.quote)}</div><p class="mini-note">${selected?`선택 이후 ${c.disease==='투약안전'?'투약 진행 상황':'환자 상태'}가 반영되었습니다.`:'환자 변화와 주변 상황을 함께 살펴보세요.'}</p><p class="tiny patient-summary" style="margin-top:15px">가상 상황입니다. 실제 현장에서는 지도자의 감독과 기관 절차를 따릅니다.</p></aside><section class="card decision-card"><div class="step-caption"><span>STEP ${r.step+1} / 4</span><span>${esc(s.label)}</span></div><div class="case-step" aria-label="${r.step+1}/4단계">${[0,1,2,3].map(i=>`<i class="${i===r.step?'current':i<r.step?'done':''}"></i>`).join('')}</div><div class="scene"><div class="scene-label">${r.step===0?'THE SITUATION':'WHAT HAPPENED NEXT'}</div>${esc(selected?r.snapshot.context:s.context)}</div><h2 class="decision-title">${esc(selected?r.snapshot.question:s.question)}</h2><div class="decision-options">${(selected?r.snapshot.options:s.options).map((op,i)=>`<button class="option ${r.selected===i?'selected':''}" data-action="clinical-answer" data-index="${i}" ${selected?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(op.text)}</span>${r.selected===i?icon('check'):''}</button>`).join('')}</div>${selected?`<div class="case-consequence" role="status"><div class="eyebrow" style="margin-bottom:7px">YOUR DECISION → NEXT</div><h3>${r.caseId==='medication'?'투약 상황이 달라졌어요':'다음 상황을 확인하세요'}</h3><p>${esc(last.outcome)}</p>${btn((r.step===3?'Clinical Report 보기':'다음 상황으로')+' '+icon('arrow'),'clinical-next','','full')}</div>`:`<p class="mini-note">선택하면 행동이 적용되고 다음 상황이 공개됩니다.</p>`}</section></div>${SOURCES}`}
function clinicalAnswer(index){const r=state.clinical;if(!r||r.complete||r.selected!==null)return;const s=clinicalStep(r),option=s.options[index];if(!option)return;r.snapshot=JSON.parse(JSON.stringify(s));r.selected=index;r.risk+=option.effects.risk||0;Object.assign(r.flags,option.effects);r.history.push({step:r.step,label:s.label,choice:index,...JSON.parse(JSON.stringify(option))});r.vitals=nextVitals(r);meaningfulDay();render();setTimeout(()=>$('.case-consequence')?.scrollIntoView({behavior:'smooth',block:'nearest'}),60)}
function clinicalNext(){const r=state.clinical;if(!r||r.complete||r.selected===null)return;if(r.step<3){r.step++;r.selected=null;delete r.snapshot;render();setTimeout(()=>$('.decision-card')?.scrollIntoView({behavior:'smooth',block:'start'}),40)}else finishClinical()}
function finishClinical(){const r=state.clinical;if(!r||r.complete)return;r.complete=true;const scores=DIMENSIONS.map((_,i)=>Math.round(r.history.reduce((s,h)=>s+h.scores[i],0)/4));const before=clinicalAverage();const gained=award('clinical:'+r.caseId+':'+day(),200,50,'Clinical Simulation 완료');let loopXP=0;const topic=CASE_INFO[r.caseId].disease;const matching=state.quizRuns.some(q=>q.day===day()&&relatedCase(q.topic)===r.caseId);if(matching&&!state.loops.some(l=>l.day===day()&&l.caseId===r.caseId)){state.loops.push({day:day(),caseId:r.caseId});loopXP=award('daily-loop:'+day(),50,10,'오늘의 학습 루프 완료')}
 const report={...JSON.parse(JSON.stringify(r)),day:day(),scores,before,xp:gained,school:gained?50:0,loopXP,tags:[topic,...DIMENSIONS.filter((_,i)=>scores[i]<75)]};state.clinicalRuns.push(report);state.clinicalRuns=state.clinicalRuns.slice(-60);r.reportId=report.id;addActivity(CASE_INFO[r.caseId].short,'Clinical Report · '+(gained?'+'+gained+' XP':'재훈련 완료'),'clinical');view.reportId=report.id;view.sub='clinical-result';render(true);toast(gained?`실전 훈련 완료 · +${gained} XP · 학교 +50점`:'재훈련 결과를 저장했어요. 오늘의 보상은 이미 받았어요.')}
function renderClinicalResult(){const r=state.clinicalRuns.find(x=>x.id===view.reportId)||state.clinicalRuns.at(-1);if(!r){view.sub=null;return renderClinical()}const c=CASE_INFO[r.caseId],good=r.history.filter(h=>h.scores.reduce((a,b)=>a+b,0)/4>=75),improve=r.history.filter(h=>h.scores.reduce((a,b)=>a+b,0)/4<75),weakI=r.scores.indexOf(Math.min(...r.scores));return `<div class="page-head"><div><div class="eyebrow">PRACTICE → GROW</div><h1>Clinical Judgment Report</h1><p>${esc(c.short)} · 4단계 훈련 완료</p></div><span class="icon-tile mint">${icon('check')}</span></div><div class="grid2"><div class="stack"><div class="card"><div class="between"><h2>판단의 강점과 다음 한 걸음</h2></div><p class="meta" style="margin-top:8px">선택에 따라 계산된 학습 지표 · 100점 기준</p>${DIMENSIONS.map((d,i)=>metric(d,r.scores[i],r.scores[i]<75,r.scores[i]-r.before[i])).join('')}<div class="notice ${r.scores[weakI]<75?'orange':'green'}"><b>${r.scores[weakI]<75?'우선 돌아볼 영역: '+DIMENSIONS[weakI]:'네 영역에서 균형 있게 판단했어요.'}</b><br>${r.scores[weakI]<75?'아래 피드백을 읽고 같은 개념의 문제로 다시 연결해보세요.':'다른 시나리오에서도 이 판단의 순서를 연습해보세요.'}</div><p class="tiny" style="margin-top:14px">실제 임상 역량을 인증하는 점수가 아닌, 예시 선택 기준에 따른 피드백입니다.</p></div><div class="card"><div class="eyebrow">LEARNING REWARDS</div><h3>오늘의 판단이 성장으로 쌓였어요.</h3><div class="rewards"><span class="reward">${icon('bolt')} +${r.xp} XP</span><span class="reward">${icon('school')} 학교 +${r.school}점</span></div>${r.loopXP?`<p class="green" style="font-size:13px;margin-bottom:12px">${icon('check')} 학습 → 실전 루프 완성 · 추가 +${r.loopXP} XP / 학교 +10점</p>`:''}<p class="tiny">${r.xp?'개인 XP와 학교 점수에 반영했어요.':'같은 시나리오의 오늘 보상은 이미 받았어요. 평가 기록은 새로 반영됩니다.'}</p><div class="row wrap" style="margin-top:21px">${btn('리그에 반영된 성장 보기 '+icon('arrow'),'report-league')}${btn('MY 리포트','nav','data-page="my"','light')}</div></div></div><div class="stack"><div class="card"><h3 class="green">잘한 점</h3><p class="meta" style="margin-top:11px">${good.length?esc(good[0].feedback):'4단계의 결과를 끝까지 확인했어요. 피드백을 바탕으로 대응 순서를 다시 연습해볼 수 있습니다.'}</p><div class="divider"></div><h3 class="orange">개선이 필요한 영역</h3><p class="meta" style="margin-top:11px">${improve.length?esc(improve[0].feedback):'이번 사례에서 큰 누락은 없었어요. 환자 상태가 달라져도 재사정과 보고를 이어가는 연습을 해보세요.'}</p><div style="margin:18px 0">${tags(improve.length?r.tags:[c.disease,'다음 상황에 적용'],'orange')}</div>${btn((improve.length?'취약영역 문제 풀기':'관련 개념 문제 풀기')+' '+icon('arrow'),'start-quiz',`data-topic="${esc(c.disease)}"`,'full')}</div><div class="card"><h3 style="margin-bottom:22px">나의 판단 돌아보기</h3><ol class="timeline">${r.history.map((h,i)=>`<li><span class="dot">${i+1}</span><div><b>${esc(h.label)}</b><p>${esc(h.text)}</p><p style="color:${h.scores.reduce((a,b)=>a+b,0)/4>=75?'#438d75':'#aa7a41'}">${esc(h.feedback)}</p></div></li>`).join('')}</ol></div></div></div><div class="between wrap section"><button class="text-btn" data-action="start-case" data-id="${r.caseId}">${icon('refresh')} 같은 상황 다시 훈련하기</button><button class="text-btn" data-action="nav" data-page="clinical">다른 시나리오 보기 ${icon('arrow')}</button></div>${SOURCES}`}
function renderLeague(){const p=personalStats(),ranks=personalRows(),myrank=ranks.findIndex(x=>x.points===p.points)+1;let body='';if(view.leagueTab==='personal'){body=`<div class="league-hero"><div><div class="eyebrow">나의 성장으로 만나는 리그</div><h2>${esc(state.profile.nickname)}</h2><p>학교와 실명은 숨기고, 지난주의 나보다 자라는 중.<br>비슷한 학습 리듬의 8명과 함께하는 예시 리그예요.</p></div><div class="league-score"><strong>${myrank}<small>위</small></strong><p>8명 중 · DEMO</p></div></div><div class="grid2 league-layout"><div class="card rank-card">${sectionHead('이번 주 개인 리그','닉네임만 공개 · 2026 가을 학기',`<span class="tag blue">성장 포인트</span>`)}<table class="rank-table"><thead><tr><th>순위</th><th>닉네임</th><th>학습일</th><th>포인트</th></tr></thead><tbody>${ranks.map((r,i)=>`<tr class="${r.me?'me':''}"><td>${ranks.findIndex(x=>x.points===r.points)+1}</td><td><div class="row"><span class="rank-avatar">${icon(r.me?'leaf':'user')}</span><span class="name">${esc(r.name)}${r.me?'<span class="my-mark">나</span>':''}</span></div></td><td>${r.days}일</td><td class="number">${r.points.toFixed(1)}</td></tr>`).join('')}</tbody></table><p class="tiny" style="padding:14px 10px 0">점수와 순위는 프로토타입용 가상 데이터입니다.<br>다른 참여자와 매칭되지 않으며, 내 활동만 이 기기에서 반영됩니다.</p></div><div class="stack"><div class="card"><div class="eyebrow">MY GROWTH POINTS</div><h2>${p.points.toFixed(1)} <small class="muted">/ 100</small></h2><div class="metric-mini"><div><strong>+${p.growth}%</strong><small>주간 XP 성장률</small></div><div><strong>${p.days}일</strong><small>학습 참여</small></div><div><strong>${p.loops}회</strong><small>학습 루프</small></div></div>${metric('나의 지난주 대비 성장 · 40점',Math.round(p.parts[0]/40*100))}${metric('학습한 날짜 · 40점',Math.round(p.parts[1]/40*100))}${metric('학습 → 실전 완료 · 20점',Math.round(p.parts[2]/20*100))}<button class="text-btn" data-action="league-rules">포인트 산정 방식 ${icon('info')}</button></div><div class="notice blue">${icon('lock')} <b>이번 학기 개인 리그는 닉네임만.</b><br>학교 정보는 대학·지역 탭에서만 표시해요. 접속만으로는 점수가 오르지 않아요.<button class="text-btn" data-action="nickname">닉네임 설정 ${icon('chevron')}</button></div></div></div><div class="notice blue section"><b>오늘의 작은 목표: 문제 복습 후 실전 훈련 1회</b><br>정답률 자체보다 나의 성장과 꾸준한 참여를 반영해요. 순위와 무관하게 학습 기록은 계속 쌓입니다.</div>`}else{const region=view.leagueTab==='region'?view.region:'전국',rows=schoolRows().filter(x=>region==='전국'||x.region===region),me=schoolRows().find(x=>x.name===state.profile.school),rank=rows.findIndex(x=>x.name===state.profile.school)+1;body=`<div class="league-hero"><div><div class="eyebrow">TOGETHER, WE GROW</div><h2>${esc(state.profile.school)}</h2><p>나의 학습이 우리 학교의 한 걸음이 됩니다.<br>실전 훈련 완료 +50점 · 문제 정답 +5점</p></div><div class="league-score"><strong>${schoolRank()}<small>위</small></strong><p>전국 · ${n(me.score)}점</p></div></div>${view.leagueTab==='region'?`<div class="filter-pills">${['전국','수도권','충청권','호남권','영남권'].map(x=>`<button class="${view.region===x?'on':''}" data-action="region" data-region="${x}">${x}</button>`).join('')}</div>`:''}<div class="card rank-card">${sectionHead(region==='전국'?'전국 대학 리그':region+' 대학 리그',rank?`우리 학교는 ${region} ${rank}위예요.`:'선택한 지역의 예시 대학을 보여드려요.',`<span class="demo-label">DEMO</span>`)}<table class="rank-table"><thead><tr><th>순위</th><th>대학교</th><th>지역</th><th>학교 점수</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.name===state.profile.school?'me':''}"><td>${i+1}</td><td><span class="name">${esc(r.name)}${r.name===state.profile.school?'<span class="my-mark">내 학교</span>':''}</span></td><td>${r.region}</td><td class="number">${n(r.score)}</td></tr>`).join('')}</tbody></table><div class="notice" style="margin-top:20px"><b>점수와 순위는 프로토타입용 가상 데이터입니다.</b><br>대학의 입시 결과나 실제 학업 수준을 나타내지 않아요. 참여 인원·학교 규모를 보정하는 기준은 추후 검증할 예정입니다.</div></div>`}
 return `<div class="page-head"><div><div class="eyebrow">03 &nbsp; COMPETE</div><h1>함께 배우는 NurseLeague</h1><p>경쟁의 기준을 넓히고, 나만의 성장을 계속해요.</p></div>${btn(icon('trend')+' 나의 성장','nav','data-page="my"','secondary small')}</div>${tabs([['personal','개인'],['school','대학'],['region','지역']],view.leagueTab,'league-tab')}${body}<div class="row wrap section">${btn('오늘의 학습 이어가기 '+icon('arrow'),'start-quiz','data-topic="패혈증"')}${btn('MY에서 변화 확인','nav','data-page="my"','light')}</div>`}

function renderAI(){const noCourses=!state.courses.length,activeCourse=view.courseId&&state.courses.some(c=>c.id===view.courseId)?view.courseId:state.courses[0]?.id;return `<div class="grid2"><div class="stack"><div class="card"><div class="eyebrow">YOUR NOTES → YOUR PRACTICE</div><h2>내가 공부한 자료로,<br>나에게 필요한 복습.</h2><p class="meta" style="margin:12px 0 22px">Goodnotes 등에서 필기한 PDF를 가져오세요.<br>기본 요약은 무료로, 더 깊은 복습은 원하는 만큼.</p>${noCourses?`<div class="empty">${icon('book')}<h3>먼저 내 수업을 등록해요</h3>${btn('수업 등록','add-course')}</div>`:processing?`<div class="processing" role="status"><h3>복습자료를 준비하고 있어요 <span class="tag blue">DEMO</span></h3><p class="tiny" style="margin:8px 0 14px">${esc(selectedFile?.name||'샘플 PDF')}</p>${['수업자료 준비 중','핵심 개념 구성 중','필기 강조 예시 연결 중','맞춤 복습자료 만드는 중'].map((x,i)=>`<div class="process-step ${i===aiProgress?'active':i<aiProgress?'done':''}"><span class="process-dot">${i<aiProgress?'✓':''}</span>${x}…</div>`).join('')}</div>`:`<div class="field" style="margin-bottom:17px"><label for="ai-course">자료를 보관할 수업</label><select id="ai-course">${state.courses.map(c=>`<option value="${esc(c.id)}" ${c.id===activeCourse?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="upload-zone" id="drop-zone"><div class="upload-icon">${icon('upload')}</div><h3>필기한 PDF 가져오기</h3><p>파일을 선택하거나 이곳에 놓아주세요.<br>PDF · 최대 25MB</p><input id="pdf-input" type="file" accept=".pdf,application/pdf" aria-label="필기한 PDF 파일 선택"></div><div id="file-error" class="form-error" role="alert"></div><div id="picked-file">${selectedFile?pickedFileHTML():''}</div><button class="btn full" id="analyze-button" data-action="analyze" style="margin-top:17px" ${selectedFile?'':'disabled'}>${icon('spark')} 무료 AI 분석 시작</button><button class="text-btn" data-action="sample-pdf" style="width:100%;justify-content:center;margin-top:9px">파일 없이 샘플 자료로 체험 ${icon('arrow')}</button>`}<p class="tiny" style="margin-top:18px"><b>AI 분석 시뮬레이션 · DEMO</b><br>파일은 외부로 전송되지 않아요. 실제 PDF 본문·필기를 읽지 않고, 패혈증 예시 let fileSelectionSeq=0;
async function pickFile(file){const seq=++fileSelectionSeq;selectedFile=null;let error='';if(!file)return;if(!/\.pdf$/i.test(file.name))error='PDF 파일을 선택해주세요.';else if(file.size===0)error='빈 파일은 분석할 수 없어요.';else if(file.size>25*1024*1024)error='25MB 이하의 PDF 파일을 선택해주세요.';else{try{const header=await file.slice(0,5).text();if(header!=='%PDF-')error='PDF 형식을 확인할 수 없어요. PDF로 다시 저장해주세요.'}catch{error='파일을 읽지 못했어요. 다시 선택해주세요.'}}if(seq!==fileSelectionSeq)return;if(!error)selectedFile=file;const e=$('#file-error');if(e)e.textContent=error;const p=$('#picked-file');if(p)p.innerHTML=selectedFile?pickedFileHTML():'';const b=$('#analyze-button');if(b)b.disabled=!selectedFile;}
function analyze(sample=false){if(processing)return;if(!state.courses.length){openCourseMenu();return}if(sample)selectedFile={name:'DEMO_6주차_패혈증과_쇼크.pdf',size:1420000,sample:true};if(!selectedFile){toast('PDF 파일을 먼저 선택해주세요.');return}const courseId=$('#ai-course')?.value||view.courseId||state.courses[0].id;const file={name:selectedFile.name,size:selectedFile.size,sample:!!selectedFile.sample};view.page='learn';view.learnTab='ai';view.sub=null;processing=true;aiProgress=0;render();const timer=setInterval(()=>{aiProgress++;if(aiProgress<4){if(view.page==='learn'&&view.learnTab==='ai'&&!view.sub)render();return}clearInterval(timer);processing=false;const doc={id:uid('pdf'),courseId:state.courses.some(c=>c.id===courseId)?courseId:state.courses[0]?.id||null,name:file.name,size:file.size,sample:file.sample,disease:'패혈증',date:day(),generated:{},reviewed:false,uploaded:!file.sample};state.docs.unshift(doc);selectedFile=null;save();if(view.page==='learn'&&view.learnTab==='ai'&&!view.sub){view.docId=doc.id;view.sub='doc';render(true)}toast('무료 기본 요약이 준비됐어요 · AI 분석 DEMO')},560)}
function docContent(d){if(d.disease==='심부전')return {title:'심부전과 간호',keys:['심부전','폐울혈','체액 저류','호흡곤란','일일 체중'],marks:['호흡 변화','같은 조건의 체중','체액 추세'],summary:['심부전 환자는 호흡곤란이나 말초부종 등 다양한 증상을 보일 수 있습니다.','같은 조건의 체중과 증상 변화를 함께 기록하면 체액 상태의 추세를 관찰하는 데 도움이 됩니다.','갑작스러운 호흡 악화는 신속한 사정과 즉시 도움 요청으로 연결합니다.']};if(d.disease==='호흡곤란')return {title:'호흡기계 · 호흡 상태 사정',keys:['기도','호흡수','산소화','호흡 노력','의식 변화'],marks:['갑작스러운 숨참','SpO₂ 변화','재사정'],summary:['호흡 곤란에서는 기도와 호흡을 신속히 사정하고 필요한 도움을 요청합니다.','호흡수·노력·의식과 산소 공급 상태를 SpO₂와 함께 확인합니다.','수치가 개선되어도 증상이 남아 있다면 재평가가 필요합니다.']};return {title:'패혈증과 초기 대응',keys:['패혈증','Septic shock','Lactate','Fluid resuscitation','Vasopressor'],marks:['혈압 저하','젖산 상승','조기 대응'],summary:['감염이 의심되는 환자의 저혈압과 의식·호흡 변화는 긴급 평가가 필요한 신호입니다.','패혈증을 단일 검사로 판단하지 않습니다. 관류, 호흡, 의식, 소변량 등 여러 단서와 변화 추세를 함께 봅니다.','팀의 신속한 평가·치료를 지원하고, 처방과 감독 아래 안전 확인 및 처치 반응의 관찰을 이어갑니다.']}}
function renderDoc(){const d=state.docs.find(d=>d.id===view.docId);if(!d){view.sub=null;return renderLearn()}const t=docContent(d),c=state.courses.find(x=>x.id===d.courseId);return `<div class="breadcrumb"><button data-action="learn-tab" data-tab="ai">AI 학습</button>${icon('chevron')}<span>무료 분석 결과</span></div><div class="page-head"><div><div class="eyebrow">AI STUDY · DEMO</div><h1>${esc(t.title)}</h1><p>${esc(c?.name||'내 자료')} · ${esc(d.name)}</p></div><span class="tag green">분석 완료</span></div><div class="notice" style="margin-bottom:22px">${icon('info')} <b>실제 PDF를 분석한 결과가 아닌, ${esc(d.disease)} 샘플 결과입니다.</b> 필기 강조 부분도 예시이며 업로드한 문서의 내용과 무관합니다. 파일 내용은 보관하지 않고 파일명·학습 결과만 이 기기에 저장합니다.</div><div class="grid2"><div class="stack"><div class="card"><div class="between"><h2>기본 요약</h2><span class="tag green">무료</span></div><ol class="summary-list">${t.summary.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="divider"></div><h3 style="margin-bottom:13px">핵심 개념</h3>${tags(t.keys,'blue')}<h3 style="margin:24px 0 13px">필기 강조 개념 <span class="tag">예시</span></h3>${tags(t.marks,'orange')}<div class="divider"></div><h3>복습 체크리스트</h3>${['주요 위험 신호를 설명할 수 있어요','먼저 해야 할 행동을 고를 수 있어요','핵심 정보를 구조적으로 보고할 수 있어요'].map((x,i)=>`<label class="list-row" style="font-size:13px;cursor:pointer"><input type="checkbox" data-doc-check="${i}" ${d.checks?.[i]?'checked':''} style="accent-color:var(--blue);width:18px;height:18px">${x}</label>`).join('')}<button class="btn ${d.reviewed?'light':'secondary'} full" data-action="review-doc" style="margin-top:16px">${icon(d.reviewed?'check':'book')} ${d.reviewed?'복습 완료 · 다시 확인 가능':'기본 요약 복습 완료'}</button></div></div><div class="stack"><div class="card soft"><div class="eyebrow">AI LEARNING CONNECTION · DEMO</div><h3>개념 다음은, 판단 연습.</h3><p class="meta" style="margin-top:13px">현재 누적 기록에서 개념형 정답률은 <b>${rate(metrics().types['개념'])}%</b>, ${esc(weakType())} 유형은 <b>${rate(metrics().types[weakType()])}%</b>예요. 배운 내용을 상황에 적용하는 복습을 추천해요.</p><p class="tiny" style="margin-top:13px">초기 예시 기록과 이번 시연의 응답에 기반한 규칙형 추천입니다.</p></div><div class="card"><h2>더 깊게 공부해볼까요?</h2><p class="meta" style="margin-top:8px">필요한 복습만 선택하세요. AI 크레딧 ${state.credits}개 남음</p><div class="ai-actions">${[['quiz','target','AI 맞춤문제 만들기','1 AI 크레딧 · 예시 3문제'],['note','note','시험 핵심노트 생성','1 AI 크레딧 · 시험 직전 복습'],['flash','cards','플래시카드 만들기','1 AI 크레딧 · 핵심 개념 5개']].map(([type,ic,title,sub])=>`<button class="ai-action" data-action="generate" data-type="${type}"><span class="icon-tile">${icon(ic)}</span><span class="grow"><b>${d.generated[type]?'만든 자료 다시 열기':title}</b><small>${d.generated[type]?'추가 차감 없음 · '+title:sub}</small></span>${icon('chevron')}</button>`).join('')}<button class="ai-action" data-action="recommend-case"><span class="icon-tile mint">${icon('clinical')}</span><span class="grow"><b>Clinical Simulation 추천받기</b><small>관련 실전 훈련 · 무료</small></span>${icon('chevron')}</button></div><p class="tiny" style="margin-top:17px">기본 문제풀이는 무료예요. 자료 기반 맞춤 생성에만 크레딧을 사용합니다.</p></div></div></div>${SOURCES}`}
function generate(type){const d=state.docs.find(x=>x.id===view.docId);if(!d||!['quiz','note','flash'].includes(type))return;if(!d.generated[type]){if(state.credits<1){showModal('AI 크레딧이 부족해요',`<p class="muted">기본 요약과 무료 문제풀이는 계속 사용할 수 있어요. 필요한 만큼만 추가해보세요.</p><div class="modal-actions">${btn('데모 크레딧 +5','topup','','secondary')}${btn('Student Pro 보기','membership')}</div>`);return}state.credits--;d.generated[type]=true;save();toast('1 AI 크레딧 사용 · DEMO 복습자료 생성 완료')}if(type==='quiz'){if(d.disease==='패혈증')startQuizWithGuard(['패혈증','major','성인간호학',true]);else startQuizWithGuard([d.disease,'major',null,false]);return}render();if(type==='note')openNote(d);if(type==='flash'){flashIndex=0;flashFlipped=false;openFlash(d)}}
function openNote(d){const t=docContent(d);showModal('시험 직전 · 핵심노트',`<div class="eyebrow">${esc(d.disease)} · AI DEMO</div><div class="notice blue">위험 인식 → 신속한 도움 요청 → 안전한 준비 → 재사정과 보고</div><ol class="summary-list">${t.summary.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="notice orange"><b>헷갈리지 않기</b><br>수치 하나로 단정하지 않기 · 검사 결과를 기다리며 대응을 늦추지 않기 · 학생 역할과 감독 범위 지키기</div><p class="tiny" style="margin-top:17px">${esc(d.name)}에 연결한 샘플 노트이며 실제 문서 분석 결과는 아닙니다.</p><div class="modal-actions">${btn('노트 확인 완료','close-modal')}</div>`)}
function flashData(d){const t=docContent(d);return t.keys.map((k,i)=>[k,d.disease==='패혈증'?['감염과 관련된 급격한 상태 악화에 주의를 기울이고 즉시 평가로 연결해요.','순환 이상이 지속되는 응급 상황으로, 의료진의 신속한 평가와 치료가 필요해요.','임상 상태와 함께 해석하는 젖산 검사. 한 가지 결과로 패혈증을 확진하지 않아요.','수액 소생은 처방·환자 상태에 따라 진행하며 반응과 부작용을 관찰해요.','승압제는 의료진이 적응증과 용량을 결정하며, 학생이 독자적으로 조절하지 않아요.'][i]:t.summary[i%3]])}
function openFlash(d){const ds=flashData(d);showModal('핵심 개념 플래시카드',`<div class="between"><span class="tag blue">${esc(d.disease)} · DEMO</span><span class="tiny">${flashIndex+1} / ${ds.length}</span></div><button class="flashcard" data-action="flip-card"><span>${esc(ds[flashIndex][flashFlipped?1:0])}<small>${flashFlipped?'다시 누르면 개념 보기':'카드를 눌러 설명을 확인하세요'}</small></span></button><div class="between">${btn(icon('back')+' 이전','flash-prev',flashIndex===0?'disabled':'','light')}${btn('다음 '+icon('arrow'),'flash-next',flashIndex===ds.length-1?'disabled':'','secondary')}</div><p class="tiny" style="margin-top:18px">만든 카드는 다시 열어도 크레딧이 차감되지 않아요.</p>`)}
function showModal(title,content,wide=false){const dlg=$('#modal');dlg.className=wide?'wide':'';dlg.innerHTML=`<div class="modal-inner"><div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close-modal" aria-label="닫기">${icon('close')}</button></div>${content}</div>`;if(!dlg.open)dlg.showModal();document.body.style.overflow='hidden'}

function profileModal(welcome=false){const p=state.profile;showModal(welcome?'NurseLeague에 오신 걸 환영해요':'나의 프로필',`${welcome?'<div class="welcome-message"><h3>외워서 맞히는 간호학에서,<br>판단하고 대응하는 간호학으로.</h3><p>지식 → 문제 → 상황 판단 → 성장.<br>기본 프로필로 3분 데모를 시작해보세요.</p></div>':''}<form id="profile-form"><div class="field"><label for="profile-name">이름</label><input id="profile-name" name="name" value="${esc(p.name)}" maxlength="20" required autocomplete="given-name"></div><div class="field"><label for="profile-school">대학교</label><input id="profile-school" name="school" value="${esc(p.school)}" maxlength="40" list="school-options" required><datalist id="school-options">${SCHOOL_DATA.map(s=>`<option value="${s.name}"></option>`).join('')}</datalist></div><div class="field-grid"><div class="field"><label for="profile-grade">학습 단계</label><select id="profile-grade" name="grade">${['1학년','2학년','3학년','4학년 / 국시 준비','신규간호사'].map(g=>`<option ${p.grade===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label for="profile-region">학교 지역</label><select id="profile-region" name="region">${['수도권','충청권','호남권','영남권','기타 지역'].map(x=>`<option ${p.region===x?'selected':''}>${x}</option>`).join('')}</select></div></div><p class="tiny" style="margin-top:17px">학교 목록 선택 시 해당 지역이 자동 반영됩니다.<br>실제 인증이 없는 데모예요. 이름·학교는 개인 리그에 공개되지 않아요.</p><div class="form-error" id="profile-error" role="alert"></div><button class="btn full" type="submit" style="margin-top:8px">${welcome?'데모 시작하기':'프로필 저장'} ${icon('arrow')}</button></form>`)}

function joinForm(){showModal('클래스 코드로 참여',`<p class="meta">테스트 코드 <b class="blue">NURSE2026</b>을 입력해보세요.<br>기본간호학Ⅱ · 정교수 · 3학년 2분반</p><form id="join-form"><div class="field"><label for="join-code">클래스 코드</label><input id="join-code" name="code" placeholder="NURSE2026" autocapitalize="characters" maxlength="30" required></div><div class="form-error" id="join-error" role="alert"></div><div class="modal-actions">${btn('취소','close-modal','','light')}<button class="btn" type="submit">클래스 참여</button></div></form>`)}
function membership(){showModal('내 학습에 맞는 멤버십',`<div class="notice blue"><b>가격 검증 예정 / DEMO</b><br>가격·크레딧 제공량·구성은 검증용 가설입니다. 실제 결제나 정기 구독은 발생하지 않습니다.</div><p class="meta" style="margin-top:18px">현재 <b>${esc(state.plan)}</b> · AI 크레딧 <b>${state.credits}개</b></p><div class="plan-grid">${[['Free',3,['기본 문제·학습','기본 PDF 요약','일일 Clinical Mission 일부','기본 학습 리포트']],['Student Pro',30,['AI 맞춤문제·PDF 심화 학습','플래시카드·압축노트','상세 취약점 분석','Clinical Simulation 확대']],['Exam Pass',50,['Student Pro 포함','국시 모의고사','과락 위험 분석','국시 집중 학습']]].map(([name,credits,features])=>`<div class="plan ${name==='Student Pro'?'pro':''}"><span class="tiny">${name==='Free'?'가볍게 시작':'가격 검증 예정'}</span><h3>${name}</h3><p class="meta" style="margin-bottom:15px">월 ${credits} AI 크레딧 <small>가설</small></p><ul>${features.map(f=>`<li>${f}</li>`).join('')}</ul>${btn(state.plan===name?'현재 플랜':'DEMO로 선택','select-plan',`data-plan="${name}" ${state.plan===name?'disabled':''}`,state.plan===name?'light':name==='Student Pro'?'':'secondary')}</div>`).join('')}</div><p class="tiny" style="margin-top:15px">플랜 구성은 사업모델 시연용이며, 확대 Clinical·국시 모의고사·과락 위험 분석은 확장 예정입니다. 현재 핵심 데모는 모두 이용할 수 있어요.</p><div class="divider"></div><div class="between wrap"><div><h3 style="font-size:15px">AI 크레딧만 추가하기</h3><p class="tiny">구독 없이 필요한 만큼 · 결제 없는 시연</p></div>${btn('+5 AI 크레딧 · DEMO','topup','','secondary small')}</div><div class="future" style="margin-top:20px;padding:15px"><b>NEXT · New Nurse</b><p>졸업 후 병동별 실전 훈련으로 확장할 예정입니다.</p></div>`,true)}
function showGuide(){showModal('3분, 지식에서 판단까지',`<p class="meta" style="margin-bottom:23px">정답을 고르는 데서 끝나지 않는 학습을 시연해보세요.</p><ol class="timeline">${[['00:00–00:20','오늘의 취약영역 확인','홈에서 패혈증 42%와 우선순위 유형을 확인합니다.'],['00:20–01:00','3문제 풀고 취약점 보기','“취약영역 학습하기” → 3문제 → 결과에서 추천 실전 시작.'],['01:00–02:10','환자 상태가 달라지는 4단계','사정·보고·안전한 준비·SBAR를 선택하고 다음 상황을 확인합니다.'],['02:10–02:40','선택이 남긴 결과 확인','Clinical Report에서 역량별 점수와 +200 XP를 확인합니다.'],['02:40–03:00','리그와 MY에서 연결 확인','닉네임 개인 리그 → 대학·지역 → MY의 누적 성장까지.']].map(([t,title,desc],i)=>`<li><span class="dot">${i+1}</span><div><b>${t} · ${title}</b><p>${desc}</p></div></li>`).join('')}</ol><p class="tiny" style="margin-top:20px">두 번째 시연에서 기본 42%부터 다시 보려면 MY의 ‘데모 초기화’를 사용할 수 있어요.</p><div class="modal-actions">${btn('홈에서 시작','guide-start')}</div>`)}
function nicknameModal(){showModal('리그에서 사용할 닉네임',`<p class="meta">개인 리그에는 이름·대학교 대신 닉네임만 보여요.</p><form id="nickname-form"><div class="field"><label for="nickname">나의 닉네임</label><input id="nickname" name="nickname" maxlength="22" minlength="2" value="${esc(state.profile.nickname)}" required></div><button class="text-btn" type="button" data-action="random-nickname">${icon('refresh')} 다른 닉네임 제안</button><div class="form-error" id="nickname-error" role="alert"></div><div class="modal-actions"><button class="btn" type="submit">닉네임 저장</button></div></form>`)}
const actions={
 'nav':el=>{closeModal();nav(el.dataset.page)},'close-modal':closeModal,'edit-profile':()=>profileModal(false),'guide':showGuide,'guide-start':()=>{closeModal();nav('home')},
 'learn-tab':el=>{closeModal();view.page='learn';view.sub=null;view.learnTab=el.dataset.tab;render(true)},
 'subject':el=>{view.subject=el.dataset.subject;render()},
 'course':el=>{view.page='learn';view.sub='course';view.courseId=el.dataset.id;render(true)},
 'add-course':openCourseMenu,'course-form':courseForm,'join-form':joinForm,
 'delete-course':el=>{const c=state.courses.find(x=>x.id===el.dataset.id);if(!c)return;const docs=state.docs.filter(x=>x.courseId===c.id).length;showModal('이 수업을 삭제할까요?',`<p class="muted"><b>${esc(c.name)}</b> 수업과 연결된 자료 ${docs}개의 보관 정보가 삭제됩니다. 이미 완료한 학습 기록은 유지됩니다.</p><div class="modal-actions">${btn('취소','close-modal','','light')}${btn('수업 삭제','confirm-delete-course',`data-id="${esc(c.id)}"`,'danger')}</div>`)},
 'confirm-delete-course':el=>{state.courses=state.courses.filter(c=>c.id!==el.dataset.id);state.docs=state.docs.filter(d=>d.courseId!==el.dataset.id);closeModal();view.courseId=state.courses[0]?.id||null;view.page='learn';view.sub=null;view.learnTab='courses';render(true);toast('수업을 삭제했어요.')},
 'upload-course':el=>{view.page='learn';view.learnTab='ai';view.sub=null;view.courseId=el.dataset.id;render(true)},
 'doc':el=>{view.page='learn';view.sub='doc';view.docId=el.dataset.id;render(true)},
 'start-quiz':el=>{closeModal();startQuizWithGuard([el.dataset.topic||'패혈증',el.dataset.mode||'major',el.dataset.subject||null])},
 'start-subject':el=>{startQuizWithGuard([el.dataset.subject,'exam',el.dataset.subject,false,true])},
 'target-review':()=>{const type=weakType(),ids=QUESTIONS.filter(q=>q.type===type&&!q.id.startsWith('sa')).slice(0,3).map(x=>x.id);if(state.quiz&&!state.quiz.complete){view.page='learn';view.sub='quiz';render(true);toast('풀던 세트를 마친 뒤 취약 유형 복습을 이어가세요.');return}createQuiz(QUESTION_MAP[ids[0]].disease);state.quiz.ids=ids;state.quiz.title=type+' · 집중 복습';render(true)},
 'confirm-quiz':()=>{const args=pendingQuiz;pendingQuiz=null;closeModal();if(args)createQuiz(...args)},
 'resume-quiz':()=>{closeModal();if(!state.quiz)return;view.page='learn';view.sub=state.quiz.complete?'quiz-result':'quiz';render(true)},
 'pause-quiz':()=>{view.sub=null;render(true);toast('풀이 기록을 저장했어요.')},'answer':el=>answer(Number(el.dataset.index)),'next-question':nextQuestion,
 'start-case':el=>beginCase(el.dataset.id),'confirm-case':el=>newCase(el.dataset.id),
 'resume-case':()=>{closeModal();view.page='clinical';view.sub='case';render(true)},
 'pause-case':()=>{view.sub=null;render(true);toast('훈련을 저장했어요. 언제든 이어갈 수 있어요.')},
 'clinical-answer':el=>clinicalAnswer(Number(el.dataset.index)),'clinical-next':clinicalNext,
 'view-report':el=>{closeModal();view.page='clinical';view.sub='clinical-result';view.reportId=el.dataset.id;render(true)},
 'report-league':()=>{view.leagueTab='personal';nav('league')},
 'league-tab':el=>{view.leagueTab=el.dataset.tab;render()},'region':el=>{view.region=el.dataset.region;render()},
 'league-rules':()=>{const p=personalStats();showModal('개인 리그 포인트는 이렇게 쌓여요',`<div class="notice blue"><b>학교나 정답률로 줄 세우지 않아요.</b><br>닉네임만 공개하고 나의 이전 기록과 꾸준한 학습을 기준으로 비교합니다.</div><ol class="summary-list"><li><b>나의 XP 성장 · 40점</b><br>지난주 대비 주간 XP 증가율을 0~100%로 제한하고 0.4를 곱합니다. 현재 기준선은 ${n(p.baseline)} XP예요. 이전 주 기록이 없으면 이 항목은 0점으로 시작합니다.</li><li><b>학습한 날짜 · 40점</b><br>이번 주 실제로 문제에 응답하거나 실전 판단을 한 날짜 ÷ 7 × 40. 단순 접속은 포함하지 않습니다.</li><li><b>학습 루프 · 20점</b><br>같은 날 관련 문제 세트와 실전 훈련을 모두 완료하면 1회. 주 최대 5회를 반영합니다.</li></ol><p class="tiny">동점이면 함께 같은 성장 수준으로 봅니다. 표의 나열 순서에는 의미를 부여하지 않습니다. 예시 참여자는 실제 사용자가 아니며, 기준과 가중치는 사용자 테스트를 위한 가설입니다. 초기 2회 루프와 7일 기록을 포함합니다.</p><div class="modal-actions">${btn('확인','close-modal')}</div>`)},
 'nickname':nicknameModal,'random-nickname':()=>{const names=['푸른 옷을 입은 악어','천천히 자라는 대나무','노트를 든 북극곰','새벽을 여는 수달','햇살을 모으는 고래'];const input=$('#nickname');input.value=names.filter(n=>n!==input.value)[Math.floor(Math.random()*4)]},
 'analyze':()=>analyze(false),'sample-pdf':()=>analyze(true),'generate':el=>generate(el.dataset.type),
 'review-doc':()=>{const d=state.docs.find(d=>d.id===view.docId);if(!d||d.reviewed){toast('이 자료의 기본 복습은 완료했어요.');return}if(!d.checks||d.checks.filter(Boolean).length<3){toast('복습 체크리스트 3개를 먼저 확인해주세요.');return}d.reviewed=true;meaningfulDay();const gained=award('doc:'+d.id,50,10,'PDF 기본 복습 완료');addActivity(d.name,'기본 요약 복습 · +'+gained+' XP','pdf');render();toast('복습 완료 · +'+gained+' XP')},
 'recommend-case':()=>{const d=state.docs.find(x=>x.id===view.docId);if(!d)return;const id=relatedCase(d.disease),c=CASE_INFO[id];showModal('내 자료에서 실전으로',`<div class="eyebrow">CLINICAL RECOMMENDATION · DEMO</div><h3>${esc(c.name)}</h3><p class="meta" style="margin:13px 0 18px">${esc(d.disease)} 샘플의 개념과 연결된 사례입니다. 현재 가장 낮은 유형인 ${esc(weakType())}을 상황 속에서 연습해요.</p>${tags(c.tags,'blue')}<div class="modal-actions">${btn('무료 실전 훈련 시작','start-case',`data-id="${id}"`)}</div>`)},
 'flip-card':()=>{flashFlipped=!flashFlipped;const d=state.docs.find(x=>x.id===view.docId);if(d)openFlash(d)},
 'flash-prev':()=>{flashIndex=Math.max(0,flashIndex-1);flashFlipped=false;const d=state.docs.find(x=>x.id===view.docId);if(d)openFlash(d)},
 'flash-next':()=>{flashIndex=Math.min(4,flashIndex+1);flashFlipped=false;const d=state.docs.find(x=>x.id===view.docId);if(d)openFlash(d)},
 'membership':membership,
 'select-plan':el=>{const plan=el.dataset.plan;if(!['Free','Student Pro','Exam Pass'].includes(plan))return;state.plan=plan;const amount={'Free':0,'Student Pro':30,'Exam Pass':50}[plan];if(amount&&!state.planGrants.includes(plan)){state.credits+=amount;state.planGrants.push(plan)}save();render();membership();toast(plan+' 데모로 전환했어요. 실제 결제는 발생하지 않아요.')},
 'topup':()=>{state.credits+=5;save();render();if($('#modal').open)membership();toast('DEMO · AI 크레딧 5개를 추가했어요. 결제는 없어요.')},
 'reset-demo':()=>showModal('데모를 처음으로 되돌릴까요?',`<p class="muted">이 버전에서 추가한 프로필·수업·학습 기록·크레딧이 초기 예시 상태로 돌아갑니다.</p><div class="modal-actions">${btn('취소','close-modal','','light')}${btn('데모 초기화','confirm-reset','','danger')}</div>`),
 'confirm-reset':()=>{if(processing){toast('PDF 분석 완료 후 초기화해주세요.');closeModal();return}state=seed();state.courses=[{id:'adult',name:'성인간호학Ⅱ',professor:'김교수',grade:'3학년',section:'2분반',type:'official'},{id:'child',name:'아동간호학Ⅱ',professor:'박교수',grade:'3학년',section:'2분반',type:'personal'},{id:'mental',name:'정신간호학',professor:'이교수',grade:'3학년',section:'2분반',type:'personal'},{id:'management',name:'간호관리학',professor:'최교수',grade:'3학년',section:'2분반',type:'personal'}];state.docs=[{id:'demo-sepsis',courseId:'adult',name:'6주차_패혈증과_쇼크.pdf',size:1420000,disease:'패혈증',date:day(),generated:{},sample:true,reviewed:false},{id:'demo-heart',courseId:'adult',name:'5주차_심부전과_간호.pdf',size:2150000,disease:'심부전',date:shifted(day(),-2),generated:{},sample:true,reviewed:true},{id:'demo-breath',courseId:'adult',name:'4주차_호흡기계.pdf',size:970000,disease:'호흡곤란',date:shifted(day(),-4),generated:{},sample:true,reviewed:true}];state.onboarded=true;selectedFile=null;pendingQuiz=null;closeModal();view={page:'home',learnTab:'courses',sub:null,courseId:'adult',docId:null,subject:'성인간호학',topic:'패혈증',leagueTab:'personal',region:'전국',reportId:null};render(true);toast('초기 데모로 돌아왔어요.')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=actions[el.dataset.action];if(action){e.preventDefault();action(el)}});
document.addEventListener('submit',e=>{if(!['profile-form','course-form','join-form','nickname-form'].includes(e.target.id))return;e.preventDefault();const fd=new FormData(e.target),text=(key,len)=>String(fd.get(key)||'').trim().slice(0,len);
 if(e.target.id==='profile-form'){const name=text('name',20),school=text('school',40);if(!name||!school){$('#profile-error').textContent='이름과 대학교를 입력해주세요.';return}state.profile={...state.profile,name,school,grade:text('grade',30),region:SCHOOL_DATA.find(x=>x.name===school)?.region||text('region',20)};state.onboarded=true;closeModal();render(true);toast(name+'님, 오늘의 학습을 시작해봐요.')}
 if(e.target.id==='course-form'){const name=text('name',40);if(!name){$('#course-error').textContent='과목명을 입력해주세요.';return}if(state.courses.length>=30){$('#course-error').textContent='데모에서는 최대 30개 수업까지 등록할 수 있어요.';return}const c={id:uid('course'),name,professor:text('professor',30),grade:text('grade',10),section:text('section',20),type:'personal'};state.courses.push(c);view.courseId=c.id;view.page='learn';view.sub='course';closeModal();render(true);toast('새 수업을 등록했어요.')}
 if(e.target.id==='join-form'){if(text('code',30).toUpperCase()!=='NURSE2026'){$('#join-error').textContent='테스트 코드 NURSE2026을 입력해주세요.';return}let c=state.courses.find(x=>x.code==='NURSE2026');if(!c){c={id:uid('class'),name:'기본간호학Ⅱ',professor:'정교수',grade:'3학년',section:'2분반',type:'official',code:'NURSE2026'};state.courses.push(c)}view.courseId=c.id;view.page='learn';view.sub='course';closeModal();render(true);toast('기본간호학Ⅱ 클래스에 참여했어요.')}
 if(e.target.id==='nickname-form'){const nick=text('nickname',22);if(nick.length<2){$('#nickname-error').textContent='닉네임을 2자 이상 입력해주세요.';return}if(PEERS.some(x=>x.name===nick)){$('#nickname-error').textContent='예시 참여자가 사용 중인 닉네임이에요. 다른 이름을 골라주세요.';return}state.profile.nickname=nick;closeModal();render();toast('개인 리그 닉네임을 저장했어요.')}
});
document.addEventListener('change',e=>{if(e.target.id==='pdf-input')pickFile(e.target.files[0]);if(e.target.id==='ai-course'){view.courseId=e.target.value}if(e.target.id==='profile-school'){const s=SCHOOL_DATA.find(x=>x.name===e.target.value.trim());if(s)$('#profile-region').value=s.region}if(e.target.matches('[data-doc-check]')){const d=state.docs.find(x=>x.id===view.docId);if(d){d.checks=d.checks||[false,false,false];d.checks[Number(e.target.dataset.docCheck)]=e.target.checked;save()}}});
document.addEventListener('dragover',e=>{const zone=e.target.closest('#drop-zone');if(zone){e.preventDefault();zone.classList.add('drag')}});
document.addEventListener('dragleave',e=>{e.target.closest('#drop-zone')?.classList.remove('drag')});
document.addEventListener('drop',e=>{const zone=e.target.closest('#drop-zone');if(zone){e.preventDefault();zone.classList.remove('drag');pickFile(e.dataTransfer.files[0])}});
$('#modal').addEventListener('close',()=>{document.body.style.overflow=''});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
let timerMark=performance.now();setInterval(()=>{const now=performance.now(),seconds=Math.min(15,(now-timerMark)/1000);timerMark=now;if(document.visibilityState==='visible'&&((view.page==='learn'&&view.sub==='quiz'&&state.quiz&&!state.quiz.complete)||(view.page==='clinical'&&view.sub==='case'&&state.clinical&&!state.clinical.complete))){state.studySeconds[day()]=(state.studySeconds[day()]||0)+seconds;save()}},10000);
window.addEventListener('pagehide',save);
render();if(!state.onboarded)profileModal(true);

</script></body></html>
